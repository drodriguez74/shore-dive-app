<!-- @dsCard group="Voice Logging" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Logging — Recording</title>
<style>
  :root {
    --depth-0:#0B1220; --depth-1:#111A2E; --depth-2:#182444; --depth-3:#1F2E54; --depth-border:#2A3A63;
    --sky-300:#7dd3fc; --sky-400:#38bdf8; --sky-500:#0ea5e9;
    --zinc-50:#fafafa; --zinc-100:#f4f4f5; --zinc-200:#e4e4e7; --zinc-300:#d4d4d8; --zinc-400:#a1a1aa;
    --zinc-500:#71717a; --zinc-600:#52525b; --zinc-700:#3f3f46; --zinc-800:#27272a; --zinc-900:#18181b;

    --font-display: 'Space Grotesk', 'Avenir Next', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Geist Sans', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;

    --bg-canvas: #05070d;
    --bg-app: var(--depth-0);
    --bg-card: var(--depth-1);
    --bg-raised: var(--depth-2);
    --border: var(--depth-border);
    --text-primary: var(--zinc-50);
    --text-secondary: var(--zinc-400);
    --text-tertiary: var(--zinc-500);
  }
  :root[data-theme="light"] {
    --bg-canvas: var(--zinc-200);
    --bg-app: var(--zinc-50);
    --bg-card: #ffffff;
    --bg-raised: var(--zinc-100);
    --border: var(--zinc-200);
    --text-primary: var(--zinc-900);
    --text-secondary: var(--zinc-600);
    --text-tertiary: var(--zinc-500);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg-canvas);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; font-family: var(--font-body);
  }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--text-secondary);
    cursor: pointer; user-select: none;
  }
  .theme-toggle svg { width: 14px; height: 14px; }
  .device {
    width: 390px; max-width: 100%; background: var(--bg-app);
    border-radius: 32px; border: 1px solid var(--border);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .screen { padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 26px; min-height: 844px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-tertiary); text-decoration: none; width: fit-content; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
  .back-link svg { width: 14px; height: 14px; }

  h1 { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); margin: 4px 0 0; }
  .subtitle { font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); margin: 4px 0 0; }

  .rec-card {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    border: 1px solid var(--border); border-radius: 24px;
    background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-raised) 100%);
    padding: 40px 24px;
  }

  .rec-indicator { display: flex; align-items: center; gap: 8px; }
  .rec-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--sky-400); animation: pulse-dot 1.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .rec-indicator span { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sky-400); }

  .elapsed {
    font-family: var(--font-display); font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: 46px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); line-height: 1;
  }

  /* Waveform: bars whose heights vary, animated; frozen to a static
     pattern under prefers-reduced-motion via the global override above. */
  .waveform { display: flex; align-items: center; gap: 3px; height: 40px; }
  .waveform .bar { width: 3px; border-radius: 2px; background: var(--sky-500); animation: bar-move 1.1s ease-in-out infinite; }
  @keyframes bar-move { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
  .waveform .bar:nth-child(1) { height: 14px; animation-delay: 0.0s; }
  .waveform .bar:nth-child(2) { height: 26px; animation-delay: 0.1s; }
  .waveform .bar:nth-child(3) { height: 38px; animation-delay: 0.2s; }
  .waveform .bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
  .waveform .bar:nth-child(5) { height: 34px; animation-delay: 0.15s; }
  .waveform .bar:nth-child(6) { height: 40px; animation-delay: 0.35s; }
  .waveform .bar:nth-child(7) { height: 22px; animation-delay: 0.05s; }
  .waveform .bar:nth-child(8) { height: 30px; animation-delay: 0.25s; }
  .waveform .bar:nth-child(9) { height: 16px; animation-delay: 0.4s; }
  .waveform .bar:nth-child(10) { height: 28px; animation-delay: 0.2s; }
  .waveform .bar:nth-child(11) { height: 36px; animation-delay: 0.1s; }
  .waveform .bar:nth-child(12) { height: 18px; animation-delay: 0.3s; }
  .waveform .bar:nth-child(13) { height: 24px; animation-delay: 0.0s; }

  .hints { width: 100%; }
  .hints p.label { font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 8px; text-align: center; }
  .hint-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .hint-chip { font-size: 11.5px; color: var(--text-secondary); border: 1px dashed var(--border); border-radius: 999px; padding: 4px 10px; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-stop {
    min-height: 56px; border-radius: 16px; border: none;
    background: var(--sky-500); color: #051019; font-family: inherit; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .btn-stop svg { width: 18px; height: 18px; stroke: #051019; }
  .btn-cancel {
    min-height: 44px; border-radius: 13px; border: none; background: transparent;
    color: var(--text-tertiary); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  }

  .disclosure { display: flex; gap: 8px; align-items: flex-start; }
  .disclosure svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--text-tertiary); }
  .disclosure p { margin: 0; font-size: 11.5px; line-height: 1.55; color: var(--text-tertiary); }
</style>
</head>
<body>
  <button class="theme-toggle" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light')" aria-label="Toggle light/dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    theme
  </button>

  <div class="device">
    <div class="screen">
      <button class="back-link" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Cancel
      </button>
      <div>
        <h1>Recording your dive log</h1>
        <p class="subtitle">Mention max depth, total time, what you saw, and conditions &mdash; you'll review the draft next.</p>
      </div>

      <div class="rec-card">
        <div class="rec-indicator" aria-hidden="true">
          <span class="rec-dot"></span>
          <span>Recording</span>
        </div>
        <p class="elapsed" aria-live="polite">00:47</p>
        <div class="waveform" role="img" aria-label="Live microphone level">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="hints">
          <p class="label">Try to mention</p>
          <div class="hint-chips">
            <span class="hint-chip">Max depth</span>
            <span class="hint-chip">Total time</span>
            <span class="hint-chip">What you saw</span>
            <span class="hint-chip">Conditions</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-stop" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          Stop recording
        </button>
        <button class="btn-cancel" type="button">Cancel &mdash; discard</button>
      </div>

      <div class="disclosure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="7" r="4"/></svg>
        <p>Recorded and transcribed on this device &mdash; nothing is uploaded to log a dive.</p>
      </div>
    </div>
  </div>
</body>
</html>
