<!-- @dsCard group="Onboarding" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding — First-run empty state</title>
<style>
  :root {
    --depth-0: #0b1220;
    --depth-1: #111a2e;
    --depth-2: #182444;
    --depth-3: #1f2e54;
    --depth-border: #2a3a63;
    --dive-blue: #3b73f2;
    --dive-violet: #8365be;
    --dive-pink: #dc577f;
    --gradient-dive: linear-gradient(135deg, var(--dive-blue) 0%, var(--dive-violet) 50%, var(--dive-pink) 100%);
    --sky-400: #38bdf8;
    --sky-500: #0ea5e9;
    --zinc-400: #a1a1aa;
    --zinc-500: #71717a;
    --font-body: "Geist Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #05070d;
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    padding: 32px 12px;
    min-height: 100vh;
  }
  .device {
    width: 390px;
    max-width: 100%;
    height: 844px;
    background: var(--depth-0);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px var(--depth-border);
    position: relative;
    color: #e6ebf7;
    display: flex;
    flex-direction: column;
  }

  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 4px; }
  .app-header .title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: #f2f5fb; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gradient-dive); }

  .welcome-line {
    padding: 4px 18px 14px; font-size: 12.5px; color: var(--zinc-500);
  }

  .map-canvas {
    flex: 1; margin: 0 14px 14px; border-radius: 18px;
    background:
      radial-gradient(circle at 30% 25%, rgba(59,115,242,0.14), transparent 45%),
      radial-gradient(circle at 75% 65%, rgba(220,87,127,0.10), transparent 40%),
      var(--depth-1);
    border: 1px solid var(--depth-border);
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .map-canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--depth-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--depth-border) 1px, transparent 1px);
    background-size: 34px 34px; opacity: 0.3;
  }
  .you-pin {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--sky-400); border: 3px solid var(--depth-0);
    box-shadow: 0 0 0 6px rgba(56,189,248,0.18);
  }

  /* --- Loading shimmer, shown briefly on first load --- */
  .shimmer-chip {
    position: relative; z-index: 1; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
    background: var(--depth-2); border: 1px solid var(--depth-border);
    padding: 9px 14px; border-radius: 999px; font-size: 12px; color: #a7b2c9;
    transition: opacity 400ms ease;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky-400); }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pulse 1.1s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* --- Resolved empty-state card --- */
  .empty-card {
    position: relative; z-index: 1;
    background: var(--depth-2); border: 1px solid var(--depth-border);
    border-radius: 18px; padding: 20px; margin: 0 16px 16px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 450ms ease, transform 450ms ease;
  }
  .empty-card.show { opacity: 1; transform: translateY(0); }
  .empty-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3);
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  }
  .empty-icon svg { width: 22px; height: 22px; stroke: var(--sky-400); }
  .empty-card h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 6px; color: #f5f7fc; }
  .empty-card p { margin: 0 0 16px; font-size: 13px; line-height: 1.55; color: #a7b2c9; }
  .empty-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1; min-height: 46px; border-radius: 12px; border: none;
    background: var(--sky-500); color: #051019; font-family: var(--font-body);
    font-size: 13.5px; font-weight: 600;
  }
  .btn-secondary {
    flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid var(--depth-border);
    background: transparent; color: #cdd6ea; font-family: var(--font-body);
    font-size: 13.5px; font-weight: 500;
  }

  .bottom-nav { display: flex; justify-content: space-around; padding: 10px 8px 18px; border-top: 1px solid var(--depth-border); background: var(--depth-1); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 44px; }
  .nav-item svg { width: 21px; height: 21px; stroke: var(--zinc-500); }
  .nav-item.active svg { stroke: var(--sky-400); }
  .nav-item span { font-size: 10px; color: var(--zinc-500); }
  .nav-item.active span { color: var(--sky-400); }
</style>
</head>
<body>
<div class="device">
  <div class="app-header">
    <span class="title">Explore</span>
    <div class="avatar" aria-hidden="true"></div>
  </div>
  <p class="welcome-line">Signed in — welcome to Shore Dive.</p>

  <div class="map-canvas">
    <span class="you-pin" aria-hidden="true"></span>
    <div id="shimmer" class="shimmer-chip">
      <span class="dot"></span>
      Finding sites near you…
    </div>
    <div id="empty" class="empty-card">
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.686-7-11a7 7 0 1 1 14 0c0 5.314-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </div>
      <h2>No sites logged near you yet</h2>
      <p>Shore Dive is brand new — the map fills in as divers add real sites. Be one of the first here, or browse what's been added elsewhere so far.</p>
      <div class="empty-actions">
        <button class="btn-secondary" type="button">Browse all sites</button>
        <button class="btn-primary" type="button">Add a site</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.686-7-11a7 7 0 1 1 14 0c0 5.314-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span>Map</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Safe-Return</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h11l3 3v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
      <span>Logbook</span>
    </div>
  </div>
</div>

<script>
  // Brief, one-time "finding sites near you" shimmer settling into the
  // resolved empty state — represents the transient loading phase on a
  // brand-new account without a second blocking screen. Purely
  // decorative; respects prefers-reduced-motion by skipping straight to
  // the resolved state.
  (function () {
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var shimmer = document.getElementById("shimmer");
    var empty = document.getElementById("empty");
    var delay = reduced ? 0 : 1100;
    setTimeout(function () {
      shimmer.style.opacity = "0";
      empty.classList.add("show");
    }, delay);
  })();
</script>
</body>
</html>
