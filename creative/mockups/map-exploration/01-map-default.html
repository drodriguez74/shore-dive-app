<!-- @dsCard group="Map Exploration" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map — default (low-noise)</title>
<style>
  :root{
    --depth-0:#0b1220; --depth-1:#111a2e; --depth-2:#182444; --depth-3:#1f2e54; --depth-border:#2a3a63;
    --dive-blue:#3b73f2; --dive-violet:#8365be; --dive-pink:#dc577f;
    --gradient-dive:linear-gradient(135deg,var(--dive-blue) 0%,var(--dive-violet) 50%,var(--dive-pink) 100%);
    --sky-300:#7dd3fc; --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7;
    --emerald-400:#34d399; --emerald-500:#10b981; --emerald-600:#059669;
    --amber-400:#fbbf24; --amber-500:#f59e0b; --amber-600:#d97706;
    --rose-400:#fb7185; --rose-500:#f43f5e; --rose-600:#e11d48;
    --violet-400:#a78bfa; --violet-500:#8b5cf6; --violet-600:#7c3aed;
    --zinc-300:#d4d4d8; --zinc-400:#a1a1aa; --zinc-500:#71717a; --zinc-600:#52525b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#05070c;
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--zinc-300);
    display:flex; justify-content:center; padding:24px 12px;
    min-height:100vh;
  }
  .device-note{position:fixed; top:8px; left:50%; transform:translateX(-50%); font-size:11px; color:#4b5563; letter-spacing:.02em;}
  .phone{
    width:390px; max-width:100%; min-height:780px;
    background:var(--depth-0);
    border-radius:32px;
    border:1px solid var(--depth-border);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
    overflow:hidden;
    display:flex; flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 12px;
    background:var(--depth-0);
    border-bottom:1px solid var(--depth-border);
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{
    width:26px; height:26px; border-radius:8px;
    background:var(--gradient-dive);
  }
  .brand-name{font-family:ui-sans-serif,sans-serif; font-weight:700; letter-spacing:.01em; color:#f4f4f5; font-size:15px;}
  .topbar-actions{display:flex; gap:8px;}
  .icon-btn{
    width:36px; height:36px; border-radius:10px;
    background:var(--depth-2); border:1px solid var(--depth-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--zinc-300);
  }
  .legend-chip{
    position:absolute; top:80px; right:14px; z-index:5;
    display:flex; align-items:center; gap:6px;
    background:rgba(17,26,46,.9); backdrop-filter:blur(4px);
    border:1px solid var(--depth-border); border-radius:999px;
    padding:7px 12px 7px 10px; font-size:11.5px; font-weight:500; color:var(--zinc-300);
  }
  /* ---- map canvas ---- */
  .map-wrap{position:relative; flex:1; min-height:520px; overflow:hidden;}
  .ocean{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 20% 10%, #142244 0%, #0c1730 55%, #081123 100%);
  }
  .ocean svg{position:absolute; inset:0; width:100%; height:100%;}
  .grat{stroke:#1c2a4d; stroke-width:1;}
  .coastline{fill:#1a2338; stroke:#2a3a63; stroke-width:1.5;}
  .coastline-dark{fill:#141d30;}
  .user-dot{fill:var(--sky-400); }
  .user-ring{fill:none; stroke:var(--sky-400); stroke-width:1.5; opacity:.5;}

  .pin{position:absolute; transform:translate(-50%,-100%); cursor:pointer;}
  .pin svg{display:block; filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));}
  .pin-glyph{
    position:absolute; top:-4px; right:-4px;
    width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--depth-0);
  }
  .lds-dot{
    position:absolute; width:14px; height:14px; border-radius:50%;
    border:2px solid; transform:translate(-50%,-50%);
    box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .map-caption{
    position:absolute; left:14px; bottom:14px; right:14px;
    font-size:11px; color:var(--zinc-500);
  }

  .fab{
    position:absolute; right:14px; bottom:108px;
    width:44px; height:44px; border-radius:14px;
    background:var(--depth-2); border:1px solid var(--depth-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--zinc-300); box-shadow:0 8px 20px rgba(0,0,0,.35);
  }

  .bottom-nav{
    display:flex; border-top:1px solid var(--depth-border);
    background:var(--depth-1);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px 14px; font-size:10.5px; color:var(--zinc-500);
    min-height:44px;
  }
  .nav-item.active{color:var(--sky-400);}

  .legend-panel{
    position:absolute; top:78px; right:14px; left:14px; z-index:6;
    background:var(--depth-2); border:1px solid var(--depth-border);
    border-radius:14px; padding:14px; box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
  }
  .legend-title{font-size:12px; font-weight:700; color:#f4f4f5; margin-bottom:8px; letter-spacing:.02em; text-transform:uppercase;}
  .legend-row{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--zinc-300); padding:4px 0;}
  .legend-swatch{width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid;}
</style>
</head>
<body>
<div class="device-note">Map — default state (low-noise)</div>
<div class="phone">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Shore Dive</div>
    </div>
    <div class="topbar-actions">
      <div class="icon-btn" title="Search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="icon-btn" title="Account">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      </div>
    </div>
  </div>

  <div class="map-wrap">
    <div class="ocean">
      <svg viewBox="0 0 390 560" preserveAspectRatio="xMidYMid slice">
        <line class="grat" x1="0" y1="120" x2="390" y2="120" opacity=".5"/>
        <line class="grat" x1="0" y1="260" x2="390" y2="260" opacity=".5"/>
        <line class="grat" x1="0" y1="400" x2="390" y2="400" opacity=".5"/>
        <line class="grat" x1="90" y1="0" x2="90" y2="560" opacity=".5"/>
        <line class="grat" x1="230" y1="0" x2="230" y2="560" opacity=".5"/>
        <!-- coastline landmass, left side -->
        <path class="coastline" d="M0,0 L150,0 C120,60 140,110 95,150 C60,180 90,230 60,270 C30,300 55,340 20,380 C-10,410 15,460 -10,500 L0,560 L0,0 Z"/>
        <path class="coastline-dark" d="M0,0 L60,0 C50,50 65,90 45,120 C25,150 40,190 20,220 L0,220 Z" opacity=".6"/>
      </svg>
    </div>

    <!-- legend chip (collapsed default) -->
    <div class="legend-chip">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 4 2.8c-.7.3-1.1.9-1.1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      What do these mean?
    </div>

    <!-- user location -->
    <svg style="position:absolute; left:150px; top:230px; width:34px; height:34px; transform:translate(-50%,-50%);" viewBox="0 0 34 34">
      <circle class="user-ring" cx="17" cy="17" r="13"/>
      <circle class="user-dot" cx="17" cy="17" r="5"/>
    </svg>

    <!-- Site pin 1: VERIFIED, no hazard reports, open access -> calm, no glyph -->
    <div class="pin" style="left:205px; top:190px;" title="La Jolla Cove — Verified, open access">
      <svg width="30" height="38" viewBox="0 0 24 30">
        <path d="M12 1C6.5 1 2 5.4 2 10.8 2 18 12 29 12 29S22 18 22 10.8C22 5.4 17.5 1 12 1Z" fill="var(--sky-500)" stroke="var(--sky-400)" stroke-width="2"/>
        <circle cx="12" cy="11" r="3.6" fill="#0b1220" opacity=".55"/>
      </svg>
    </div>

    <!-- Site pin 2: COMMUNITY, has hazard report, MPA restriction -> amber fill, violet ring, amber glyph -->
    <div class="pin" style="left:270px; top:270px;" title="Sunset Reef — Community, hazard reported, Marine Protected Area">
      <svg width="30" height="38" viewBox="0 0 24 30">
        <path d="M12 1C6.5 1 2 5.4 2 10.8 2 18 12 29 12 29S22 18 22 10.8C22 5.4 17.5 1 12 1Z" fill="var(--amber-500)" stroke="var(--violet-400)" stroke-width="2"/>
        <circle cx="12" cy="11" r="3.6" fill="#0b1220" opacity=".55"/>
      </svg>
      <div class="pin-glyph" style="background:var(--amber-500); color:#1c1300;">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 4 9 9 10 5-1 9-5 9-10V6l-9-4z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="16" r=".4" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- Site pin 3: VERIFIED, no hazard reports, private property -> calm fill, sky ring, rose glyph -->
    <div class="pin" style="left:130px; top:330px;" title="Cliffside Access — Verified, private property">
      <svg width="30" height="38" viewBox="0 0 24 30">
        <path d="M12 1C6.5 1 2 5.4 2 10.8 2 18 12 29 12 29S22 18 22 10.8C22 5.4 17.5 1 12 1Z" fill="var(--sky-500)" stroke="var(--sky-400)" stroke-width="2"/>
        <circle cx="12" cy="11" r="3.6" fill="#0b1220" opacity=".55"/>
      </svg>
      <div class="pin-glyph" style="background:var(--rose-500); color:#2a0410;">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
    </div>

    <!-- Site pin 4: COMMUNITY, no hazard reports, not yet assessed -> calm fill, violet ring, no glyph -->
    <div class="pin" style="left:255px; top:130px;" title="North Point — Community, not yet assessed">
      <svg width="26" height="33" viewBox="0 0 24 30">
        <path d="M12 1C6.5 1 2 5.4 2 10.8 2 18 12 29 12 29S22 18 22 10.8C22 5.4 17.5 1 12 1Z" fill="var(--sky-500)" stroke="var(--violet-400)" stroke-width="2"/>
        <circle cx="12" cy="11" r="3.6" fill="#0b1220" opacity=".55"/>
      </svg>
    </div>

    <!-- LDS / fill-station pins (small dots, existing pattern, unchanged) -->
    <div class="lds-dot" style="left:190px; top:110px; background:var(--emerald-500); border-color:#065f46;" title="La Jolla Dive & Kayak — open"></div>
    <div class="lds-dot" style="left:100px; top:250px; background:var(--amber-500); border-color:#92400e;" title="OB Pier Dive Supply — limited air"></div>

    <div class="map-caption">4 sites &middot; 2 dive shops in view</div>

    <div class="fab" title="Center on my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7.5-7-12a7 7 0 0 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Map
    </div>
    <div class="nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Logbook
    </div>
    <div class="nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 15.5,14"/></svg>
      Safe-Return
    </div>
    <div class="nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      Profile
    </div>
  </div>
</div>
</body>
</html>
