name: Keep Supabase awake

# The free-tier Supabase project pauses after ~7 days without activity.
# One real database read a day (via /api/health) prevents that.
# Note: GitHub disables scheduled workflows after 60 days with no repo
# activity — re-enable from the Actions tab if that happens.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the database through the deployed app
        run: curl --fail --silent --show-error --max-time 60 https://shore-dive-app.vercel.app/api/health
